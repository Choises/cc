<body translate="no">
  
<div class="top_bar">
   <input class="url_box" type="text" id="ytUrl" placeholder="Search or enter URL here" onkeyup="youtube_parser();">
   <button onclick="reset()">Clear</button>
</div>

<noscript style="text-align:center;color:white;">
   <h2>Please enable javascript for this site.</h2>
</noscript>

<!-- 📺 1. Η ΟΘΟΝΗ ΤΟΥ ΒΙΝΤΕΟ ΠΡΩΤΑ (ΠΑΝΩ) -->
<div class="codegena" id="player">
   <iframe src="https://youtube.com/embed/_n-S8L3_4co?list=PLZbc7UYSkhvrdzlWOkJcg28rZuUha3OmZ" frameborder="0" id="ytPlayer" allowfullscreen=""></iframe>
</div>

<!-- 📋 2. ΟΙ ΕΙΚΟΝΕΣ ΤΩΝ ΒΙΝΤΕΟ ΜΕΤΑ (ΑΠΟ ΚΑΤΩ) -->
<div class="container">
   <div id="relatedVideos" style="margin-top: 15px;">
      <!-- Related videos -->
   </div>
</div>



<!-- F A Q -->

</div>


     <script src="//apis.google.com/js/client.js?onload=handleAPILoaded" gapi_processed="true"></script>
    <script id="rendered-js">
var myTimeout;

function youtube_parser() {
  clearTimeout(myTimeout);
  var urlBox = document.getElementById("ytUrl");
  var url = urlBox.value;
  var regExp = /^.*((youtu.be\/)|(v\/)|(\/u\/\w\/)|(embed\/)|(watch\?))\??v?=?([^#\&\?]*).*/;
  var match = url.match(regExp);
  if (match && match[7].length == 11) {
    loadVideo(match[7]);
  } else if (urlBox.value != '') {
    // keyWordsearch();      
    myTimeout = setTimeout(keyWordsearch, 300);
  } else {
    reset();
  }
}

function loadVideo(id) {
  //checks whether the new video is same as the one already playing..
  //if so, exit function to avoid player refresh
  if (sessionStorage.currentID == id)
  return;
  sessionStorage.currentID = id;
  var video = document.getElementById("ytPlayer");
  video.setAttribute('src', "https://www.youtube.com/embed/" + id + "?autoplay=1&iv_load_policy=3&rel=0");
}

function reset() {
  sessionStorage.clear();
  document.getElementById('ytUrl').value = "";
  document.getElementById("ytPlayer").setAttribute('src', 'https://youtube.com/embed/_n-S8L3_4co?list=PLZbc7UYSkhvrdzlWOkJcg28rZuUha3OmZ');
  document.getElementById('relatedVideos').innerHTML = "";
}

function keyWordsearch() {
  gapi.client.setApiKey('AIzaSyDhrvd3YifzhdGGr3QOz3_0W2eP8HRT2SQ');
  gapi.client.load('youtube', 'v3', function () {
    console.log("API Called.");
    makeRequest();
  });
}

function makeRequest() {
  var q = document.getElementById('ytUrl').value;
  var request = gapi.client.youtube.search.list({
    q: q,
    part: 'snippet',
    type: 'video',
    maxResults: 3 
  });

  request.execute(function (response) {
    if (response && response.result && response.result.items) {
        var srchItems = response.result.items;
        console.log("API Returned");
        
        // 🔥 👉 ΔΙΟΡΘΩΣΗ 2: Φορτώνουμε σωστά το πρώτο βίντεο [0] της αναζήτησης live στην κεντρική οθόνη!
        if (srchItems && srchItems[0] && srchItems[0].id && srchItems[0].id.videoId) {
            loadVideo(srchItems[0].id.videoId);
        }
        
        document.getElementById('relatedVideos').innerHTML = "";
        for (var i = 1; i < srchItems.length; i++) {
            if (srchItems[i] && srchItems[i].id && srchItems[i].id.videoId) {
                var vId = srchItems[i].id.videoId;
                var vTitle = srchItems[i].snippet.title.replace(/'/g, "\\'"); // Προστασία για απόστροφους
                var vThumb = srchItems[i].snippet.thumbnails.medium.url;
                
                document.getElementById('relatedVideos').innerHTML += "<a onclick='loadVideo(\"" + vId + "\")'><img class='thumbnail' title='" + vTitle + "' src='" + vThumb + "'/></a>";
            }
        }
    }
  });
}

document.onkeydown = checkKey;
function checkKey(e) {
  e = e || window.event;
  if (e.keyCode >= 37 && e.keyCode <= 40 || e.keyCode >= 173 && e.keyCode <= 179) {
    console.log('Ignored keyboard entry');
  }
}
  </script>
